export function useTodos(initial = []) {
  const [todos, setTodos] = useState(initial)
  const [filter, setFilter] = useState('all')

  const add = useCallback((text) => {
    setTodos(t => [...t, { id: Date.now(), text, done: false, createdAt: Date.now() }])
  }, [])

  const toggle = useCallback((id) => {
    setTodos(t => t.map(x => x.id === id ? { ...x, done: !x.done } : x))
  }, [])

  const remove = useCallback((id) => {
    setTodos(t => t.filter(x => x.id !== id))
  }, [])

  return { todos, add, toggle, remove, filter, setFilter }
}

export function useCRDT() {
  const [messages, setMessages] = useState([
    { id: '0', author: 'system', lamport: 1, ts: Date.now(), text: 'CRDT initialized • offline capable • vector clock ready' }
  ])
  const [clock, setClock] = useState(1)

  const send = useCallback((text) => {
    if (!text.trim()) return
    setClock(c => c + 1)
    setMessages(m => [...m, { id: Date.now().toString(), author: 'you', lamport: clock + 1, ts: Date.now(), text }])
  }, [clock])

  return { messages, send, clock }
}

 * Pro reasoning: LWW + semantic merge
 * - trim + normalize whitespace
 * - dedup if identical to last
 * - cap 280 chars
 * - merge logs by lamport
 */
export function resolveConflict(incoming, existing) {
  if (!incoming.trim()) return ''
  const last = existing[existing.length - 1]?.text || ''
  if (last === incoming.trim()) return ''
  return incoming.replace(/\\s+/g, ' ').trim().slice(0, 280)
}

export function mergeLogs(a, b) {
  return [...a, ...b].sort((x, y) => x.lamport - y.lamport)
}

  const todos = await Todo.find({ userId: req.user.id }).sort({ createdAt: -1 })

  if (!req.body.text || req.body.text.length > 240) return res.status(400).json({ error: 'invalid text' })
  const todo = await Todo.create({ text: req.body.text, userId: req.user.id })
  res.status(201).json(todo)
})

// PATCH /api/todos/:id — toggle
router.patch('/:id', async (req, res) => {
  const todo = await Todo.findOneAndUpdate({ _id: req.params.id, userId: req.user.id }, req.body, { new: true })
  if (!todo) return res.status(404).json({ error: 'not found' })
  res.json(todo)
})

// DELETE /api/todos/:id
router.delete('/:id', async (req, res) => {
  await Todo.deleteOne({ _id: req.params.id, userId: req.user.id })
  res.json({ ok: true })
})

export default router

  if (!header) return res.status(401).json({ error: 'Missing Bearer token' })
  try {
    const token = header.replace('Bearer ', '')
    const payload = jwt.verify(token, process.env.JWT_SECRET || 'dev-secret')
    req.user = payload
    next()
  } catch (e) {
    return res.status(401).json({ error: 'Invalid token' })
  }
}
